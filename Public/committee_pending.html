<!DOCTYPE html>
<html lang="en">
<head>
    <script src="notifications.js"></script>
    <script src="config.js"></script> 
    <script src="auth.js"></script>   
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Committee Pending | L&T Valves</title>
    <script src="tailwind.js"></script>
    <link rel="stylesheet" href="fontawesome/css/all.min.css">
    <link rel="stylesheet" href="poppins.css">
    <style>
        body { font-family: 'Poppins', sans-serif; background-color: #f8fafc; color: #1e293b; overflow-x: hidden; }
        
        /* 🎨 Soft Background Blobs (Matches Index) */
        .blob { position: absolute; filter: blur(90px); z-index: -1; opacity: 0.6; animation: float 12s infinite alternate; }
        .blob-1 { top: -10%; left: -10%; width: 600px; height: 600px; background: #f3e8ff; border-radius: 40% 60% 70% 30%; } /* Soft Purple */
        .blob-2 { bottom: -10%; right: -10%; width: 600px; height: 600px; background: #dbeafe; border-radius: 60% 40% 30% 70%; animation-delay: -5s; } /* Soft Blue */
        @keyframes float { 0% { transform: translate(0, 0) rotate(0deg); } 100% { transform: translate(20px, 30px) rotate(10deg); } }
        
        /* 🪟 Light Glass Container */
        .glass-container { 
            background: rgba(255, 255, 255, 0.85); 
            backdrop-filter: blur(25px); 
            border: 1px solid rgba(0, 0, 0, 0.05); 
            border-radius: 1.5rem; 
            box-shadow: 0 10px 25px -5px rgba(0,0,0,0.05); 
            overflow: visible; 
        }
        
        /* 📊 Table Styles (Light Mode) */
        table { width: 100%; border-collapse: separate; border-spacing: 0; }
        th { 
            text-align: left; padding: 1.5rem 1rem; color: #64748b; font-size: 0.7rem; font-weight: 800; 
            text-transform: uppercase; letter-spacing: 0.08em; 
            border-bottom: 2px solid #e2e8f0; background: #f8fafc; 
            position: relative; white-space: nowrap;
        }
        td { padding: 1.25rem 1rem; color: #334155; font-size: 0.9rem; vertical-align: middle; border-bottom: 1px solid #f1f5f9; transition: background 0.3s; }
        tr:hover td { background: #f1f5f9; border-bottom-color: #e2e8f0; }
        
        /* 🖱️ Actions */
        .action-btn { padding: 8px 16px; border-radius: 10px; font-size: 0.8rem; font-weight: 700; transition: all 0.2s; display: inline-flex; align-items: center; cursor: pointer; }
        .btn-eval { background: #f3e8ff; color: #7c3aed; border: 1px solid #e9d5ff; }
        .btn-eval:hover { background: #7c3aed; color: white; transform: translateY(-2px); box-shadow: 0 4px 12px rgba(124, 58, 237, 0.2); }
        
        .slide-up { animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards; opacity: 0; transform: translateY(20px); }
        @keyframes slideUp { to { opacity: 1; transform: translateY(0); } }
        
        /* 🔍 Search Popup Styles (Light) */
        .search-trigger { margin-left: 8px; padding: 4px; border-radius: 4px; color: #94a3b8; cursor: pointer; transition: all 0.2s; }
        .search-trigger:hover, .search-trigger.active { color: #7c3aed; background: #f3e8ff; }
        .search-popup { position: absolute; top: 70%; left: 0; z-index: 60; background: #ffffff; border: 1px solid #e2e8f0; padding: 8px; border-radius: 8px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); width: 180px; display: none; animation: popIn 0.2s cubic-bezier(0.16, 1, 0.3, 1); }
        .search-popup.show { display: block; }
        .popup-input { width: 100%; background: #f8fafc; border: 1px solid #e2e8f0; color: #1e293b; padding: 6px 10px; border-radius: 4px; font-size: 0.8rem; outline: none; transition: border-color 0.2s; }
        .popup-input:focus { border-color: #7c3aed; box-shadow: 0 0 0 2px rgba(124, 58, 237, 0.1); }
        @keyframes popIn { from { opacity: 0; transform: translateY(-5px) scale(0.95); } to { opacity: 1; transform: translateY(0) scale(1); } }
    </style>
</head>
<body class="min-h-screen relative">
    <div class="blob blob-1"></div><div class="blob blob-2"></div>

    <nav class="sticky top-0 z-50 backdrop-blur-md border-b border-slate-200 px-6 py-4 flex items-center justify-between shadow-sm bg-white/90">
        <a href="index" class="text-slate-500 hover:text-purple-600 transition flex items-center group font-medium">
            <div class="w-10 h-10 rounded-xl bg-slate-100 border border-slate-200 flex items-center justify-center mr-3 group-hover:bg-purple-50 group-hover:text-purple-600 transition-all duration-300">
                <i class="fa-solid fa-arrow-left text-sm group-hover:-translate-x-1 transition"></i>
            </div>
            <span class="font-bold tracking-wide">Back to Home</span>
        </a>
        <h1 class="text-2xl font-extrabold tracking-widest text-transparent bg-clip-text bg-gradient-to-r from-purple-600 to-indigo-600">COMMITTEE<span class="text-slate-800 font-light">ZONE</span></h1>
        <div class="w-20"></div>
    </nav>

    <main class="max-w-[1400px] mx-auto px-6 py-10">
        <div class="flex flex-col md:flex-row justify-between items-end mb-8 gap-6 slide-up">
            <div>
                <h2 class="text-4xl font-extrabold text-slate-900 mb-2 tracking-tight">Pending Approvals</h2>
                <p class="text-slate-500 text-sm font-medium">Review Kaizens passed by HODs.</p>
            </div>
            <div class="bg-white px-5 py-3 rounded-xl border border-slate-200 shadow-sm flex items-center">
                <span class="text-slate-500 text-sm font-bold uppercase tracking-wider mr-3">To Review:</span>
                <span class="text-purple-600 font-extrabold text-2xl" id="count-pending">0</span>
            </div>
        </div>

        <div class="glass-container slide-up" style="animation-delay: 0.1s;">
            <div class="overflow-x-auto" style="min-height: 400px;">
                <table class="w-full text-left" id="committeeTable">
                    <thead>
                        <tr>
                            <th><div class="flex items-center"><span>ID</span><i class="fa-solid fa-magnifying-glass search-trigger" onclick="toggleSearch(0, this)"></i></div><div class="search-popup" id="popup-0"><input type="text" class="popup-input" placeholder="Search ID..." onkeyup="applyFilters(0)"></div></th>
                            
                            <th><div class="flex items-center"><span>Theme</span><i class="fa-solid fa-magnifying-glass search-trigger" onclick="toggleSearch(1, this)"></i></div><div class="search-popup" id="popup-1"><input type="text" class="popup-input" placeholder="Search Theme..." onkeyup="applyFilters(1)"></div></th>
                            
                            <th><div class="flex items-center"><span>Leader</span><i class="fa-solid fa-magnifying-glass search-trigger" onclick="toggleSearch(2, this)"></i></div><div class="search-popup" id="popup-2"><input type="text" class="popup-input" placeholder="Filter Leader..." onkeyup="applyFilters(2)"></div></th>
                            
                            <th><div class="flex items-center"><span>Dept</span><i class="fa-solid fa-magnifying-glass search-trigger" onclick="toggleSearch(3, this)"></i></div><div class="search-popup" id="popup-3"><input type="text" class="popup-input" placeholder="Filter Dept..." onkeyup="applyFilters(3)"></div></th>
                            
                            <th><div class="flex items-center"><span>Status</span><i class="fa-solid fa-magnifying-glass search-trigger" onclick="toggleSearch(4, this)"></i></div><div class="search-popup" id="popup-4"><input type="text" class="popup-input" placeholder="Filter Status..." onkeyup="applyFilters(4)"></div></th>
                            
                            <th><div class="flex items-center"><span>Date</span><i class="fa-solid fa-magnifying-glass search-trigger" onclick="toggleSearch(5, this)"></i></div><div class="search-popup" id="popup-5"><input type="text" class="popup-input" placeholder="Filter Date..." onkeyup="applyFilters(5)"></div></th>
                            
                            <th class="text-center">Action</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody"></tbody>
                </table>
            </div>
        </div>
    </main>

    <script>
        // --- 🔒 ENTERPRISE SECURITY LOGIC ---

        // 1. Better Guard to prevent back-button loops
        if (!currentUser || !currentUser.is_committee) { 
            alert("Access Denied: Committee Only"); 
            window.location.replace("index.html"); 
        }

        // 2. XSS Sanitizer for rendering DB data
        function escapeHtml(text) {
            if (!text) return "";
            return String(text).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }

        let allKaizens = [];

        document.addEventListener('DOMContentLoaded', fetchData);

        async function fetchData() {
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = '<tr><td colspan="7" class="p-8 text-center text-slate-500 font-medium animate-pulse">Loading...</td></tr>';

            try {
                // 3. Bulletproof Fetch with JSON parsing crash prevention
                const res = await fetch(`${API_BASE_URL}/get-kaizens`);
                if (!res.ok) throw new Error(`HTTP Error: ${res.status}`);
                
                const data = await res.json();
                allKaizens = data;
                renderTable();

            } catch(e) {
                console.error(e);
                tbody.innerHTML = '<tr><td colspan="7" class="p-8 text-center text-rose-500 font-bold">Error loading data. Check connection.</td></tr>';
            }
        }

        function renderTable() {
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = '';

            const myId = currentUser.emp_id;

            // Logic: Show items that are HOD Approved AND current user hasn't voted yet
            // AND (NEW) Current user is NOT part of the Kaizen (Leader, Creator, or Member)
            const filteredData = allKaizens.filter(k => {
                const isReady = (k.status === "Approved by HOD" || k.status === "Partially Approved by Committee");
                
                // Check if already voted
                let hasVoted = false;
                if (k.committee_votes && Array.isArray(k.committee_votes)) {
                    hasVoted = k.committee_votes.some(v => v.evaluator_id === myId);
                }

                // --- CONFLICT OF INTEREST CHECK (Using ID) ---
                
                // 1. Check Leader (e.g., "Rakesh (20383734)")
                const isLeader = k.leader_name && k.leader_name.includes(myId);

                // 2. Check Creator (e.g., "Rakesh (20383734)")
                const isCreator = k.created_by && k.created_by.includes(myId);

                // 3. Check Team Member (e.g., "John (123), Doe (456)")
                let isTeamMember = false;
                if(k.team_members) {
                    // Normalize to string to handle both Array and String formats
                    const membersStr = Array.isArray(k.team_members) ? k.team_members.join(' ') : k.team_members;
                    if(membersStr && membersStr.includes(myId)) {
                        isTeamMember = true;
                    }
                }

                // Show only if Ready AND Not Voted AND No Conflict
                return isReady && !hasVoted && !isLeader && !isCreator && !isTeamMember;
            });

            // --- SORTING LOGIC: HOD Approval Date (Newest to Oldest) ---
            filteredData.sort((a, b) => {
                // Get HOD evaluation date if available, else fall back to creation date/ID
                const dateA = a.hod_evaluation?.date ? new Date(a.hod_evaluation.date) : new Date(a.date || 0);
                const dateB = b.hod_evaluation?.date ? new Date(b.hod_evaluation.date) : new Date(b.date || 0);
                return dateB - dateA; // Descending Order
            });

            document.getElementById('count-pending').innerText = filteredData.length;

            if (filteredData.length === 0) {
                tbody.innerHTML = `<tr><td colspan="7" class="text-center text-slate-500 py-16 italic font-medium">No pending evaluations available.</td></tr>`;
                return;
            }

            filteredData.forEach(item => {
                const tr = document.createElement('tr');
                const rawName = item.leader_name || "Unknown";
                const nameOnly = rawName.split('(')[0].trim();
                const deptVal = item.department || item.dept || '-';

                const badgeClass = "bg-purple-50 text-purple-700 border-purple-200";
                const icon = '<i class="fa-solid fa-hourglass-half mr-1 text-purple-500"></i>';
                const statusHtml = `<span class="inline-flex items-center px-3 py-1 rounded-full text-xs font-bold border ${badgeClass}">${icon} ${item.status}</span>`;

                const actionBtn = `<a href="committee_evaluation?id=${item.id}" class="action-btn btn-eval">Evaluate <i class="fa-solid fa-arrow-right ml-2"></i></a>`;

                // 🔒 PRODUCTION FIX: Escaping all user-generated data (theme, name, dept)
                tr.innerHTML = `
                    <td class="font-mono text-purple-600 font-bold text-xs">KZN-${item.id}</td>
                    <td class="font-bold text-slate-800">
                        <div class="truncate max-w-[250px]" title="${escapeHtml(item.theme)}">${escapeHtml(item.theme)}</div>
                    </td>
                    <td>
                        <div class="flex items-center">
                            <div class="w-8 h-8 rounded-lg bg-slate-100 flex items-center justify-center text-xs font-bold mr-3 text-slate-600 border border-slate-200">${escapeHtml(nameOnly).charAt(0)}</div>
                            <span class="text-sm font-bold text-slate-700">${escapeHtml(nameOnly)}</span>
                        </div>
                    </td>
                    <td><span class="text-xs text-slate-600 font-medium border border-slate-200 px-2 py-1 rounded bg-slate-50">${escapeHtml(deptVal)}</span></td>
                    <td>${statusHtml}</td>
                    <td class="text-xs text-slate-500 font-mono font-medium">${item.date}</td>
                    <td class="text-center">${actionBtn}</td>
                `;
                tbody.appendChild(tr);
            });
        }

        // --- FILTERING LOGIC ---
        function toggleSearch(index, icon) {
            document.querySelectorAll('.search-popup').forEach((p, i) => { if(i !== index) p.classList.remove('show'); });
            document.querySelectorAll('.search-trigger').forEach(t => t.classList.remove('active'));
            const popup = document.getElementById(`popup-${index}`);
            popup.classList.toggle('show');
            icon.classList.toggle('active');
            if(popup.classList.contains('show')) popup.querySelector('input').focus();
        }

        function applyFilters(colIndex) {
            const input = document.getElementById(`popup-${colIndex}`).querySelector('input');
            const filter = input.value.toUpperCase();
            const table = document.getElementById("committeeTable");
            const tr = table.getElementsByTagName("tr");

            for (let i = 1; i < tr.length; i++) { 
                const td = tr[i].getElementsByTagName("td")[colIndex];
                if (td) {
                    const txtValue = td.textContent || td.innerText;
                    if (txtValue.toUpperCase().indexOf(filter) > -1) {
                        tr[i].style.display = "";
                    } else {
                        tr[i].style.display = "none";
                    }
                }
            }
        }

        document.addEventListener('click', function(event) {
            if (!event.target.closest('th')) {
                document.querySelectorAll('.search-popup').forEach(p => p.classList.remove('show'));
                document.querySelectorAll('.search-trigger').forEach(t => t.classList.remove('active'));
            }
        });
    </script>
</body>
</html>
